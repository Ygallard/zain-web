services:
  django:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: 8000
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    networks:
      - zaino
    restart: unless-stopped

  flask:
    build:
      context: .
      dockerfile: Dockerfile.flask
    env_file:
      - .env
    environment:
      PORT: 5000
      DJANGO_BACKEND_URL: http://django:8000
      VISITAS_DATA_PATH: /data/visitas.json
      INFORMES_DATA_DIR: /data/informes
    ports:
      - "${FLASK_PORT:-5000}:5000"
    volumes:
      - flask_data:/data
    networks:
      - zaino
    depends_on:
      - django
    restart: unless-stopped

networks:
  zaino:
    driver: bridge

volumes:
  flask_data: