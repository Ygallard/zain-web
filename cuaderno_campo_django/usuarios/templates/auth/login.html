{% extends 'base.html' %}

{% block title %}Iniciar sesion | Cuaderno de Campo{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 88vh;">
    <div class="card card-soft" style="width: 100%; max-width: 460px;">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 68px; height: 68px; background: #eef4ff; color: #2f62b3; font-size: 1.6rem;">
                    <i class="bi bi-shield-lock"></i>
                </div>
                <h4 class="mt-3 mb-1">Bienvenido</h4>
                <p class="text-muted mb-0">Ingresa tus credenciales para continuar</p>
            </div>

            <form method="post" novalidate>
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    {{ form.usuario }}
                </div>

                <div class="mb-3">
                    <label class="form-label">Contrasena</label>
                    <div class="input-group">
                        {{ form.password }}
                        <button class="btn btn-outline-secondary" type="button" id="toggle-password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-box-arrow-in-right"></i> Iniciar sesion
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const pwdInput = document.getElementById('id_password');
    const toggleBtn = document.getElementById('toggle-password');
    if (pwdInput && toggleBtn) {
        toggleBtn.addEventListener('click', () => {
            const isPassword = pwdInput.type === 'password';
            pwdInput.type = isPassword ? 'text' : 'password';
            toggleBtn.innerHTML = isPassword ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
        });
    }
</script>
{% endblock %}
