{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fujometro Caudal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/flujometro.css' %}">
</head>
<body>
    <main>
        <button id="appSidebarToggle" class="app-mobile-toggle" type="button" aria-label="Abrir menú" aria-expanded="false">
            <i class="bi bi-list"></i>
        </button>
        <button id="appSidebarOverlay" class="app-sidebar-overlay" type="button" aria-label="Cerrar menú"></button>
        <aside class="options">
            <div class="options-menu-wrapper">
                <h2>ZAINO</h2>
                <ul>
                    <li id="inicio" class="menu-item" data-view="inicio"><i class="bi bi-house-fill"></i> Inicio</li>
                    <li id="informes" class="menu-item" data-view="informes"><i class="bi bi-file-earmark-pdf-fill"></i> Informes</li>
                    <li id="cuaderno" class="menu-item" data-view="cuaderno"><i class="bi bi-journal-text"></i> Cuaderno de Campo</li>
                </ul>
                <div class="menu-auth-section">
                    <button id="btn-open-login" class="btn btn-sm btn-primary auth-btn">
                        <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
                    </button>
                    <button id="btn-logout" class="btn btn-sm btn-outline-light auth-btn" style="display: none;">
                        <i class="bi bi-box-arrow-right"></i> Cerrar sesión
                    </button>
                </div>
            </div>
        </aside>
        <section class="main-app">
            <div id="main-loading-overlay" class="loading-overlay active">
                <div class="loading-content">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                    <p class="mt-3">Cargando aplicación...</p>
                </div>
            </div>
            <div id="dynamic-content"></div>
        </section>
        </section>
    </main>

    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content login-modal-content">
                <div class="modal-header login-modal-header">
                    <div class="login-modal-title-wrap">
                        <div class="login-badge-icon"><i class="bi bi-shield-lock-fill"></i></div>
                        <div>
                            <h5 class="modal-title" id="loginModalLabel">Inicio de sesión</h5>
                            <p class="login-subtitle mb-0">Ingresa tus credenciales para continuar</p>
                        </div>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form id="login-form">
                        <div class="mb-3">
                            <label for="login-username" class="form-label">Usuario</label>
                            <input type="text" class="form-control" id="login-username" required autocomplete="username">
                        </div>
                        <div class="mb-2">
                            <label for="login-password" class="form-label">Contraseña</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="login-password" required autocomplete="current-password">
                                <button class="btn btn-outline-secondary" type="button" id="toggle-login-password" aria-label="Mostrar contraseña" aria-pressed="false">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <div class="form-check mt-2 login-show-pass-check">
                                <input class="form-check-input" type="checkbox" id="login-show-password">
                                <label class="form-check-label" for="login-show-password">
                                    Mostrar contraseña
                                </label>
                            </div>
                        </div>
                        <div id="login-error" class="text-danger small mt-2" style="display: none;"></div>
                        <button type="submit" class="btn btn-primary w-100 mt-3 login-submit-btn">
                            <i class="bi bi-box-arrow-in-right"></i>
                            Ingresar
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer></footer>
</body>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="{% static 'js/flujometro.js' %}"></script>
</html>
